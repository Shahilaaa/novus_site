{% extends "novus/base.html" %}
{% block content %}
<div style="position:relative;z-index:1;min-height:calc(100vh - 68px);display:flex;align-items:center;justify-content:center;padding:40px 28px">
<div style="width:100%;max-width:420px;border-radius:24px;border:1px solid rgba(255,255,255,.09);background:#0a0c12;overflow:hidden">
<div style="height:5px;background:linear-gradient(90deg,#8eff01,#8b53fe)"></div>
<div style="padding:38px 34px">
<div style="text-align:center;margin-bottom:28px">
<div style="font-family:Michroma,sans-serif;font-size:15px;letter-spacing:.2em;background:linear-gradient(180deg,#fff,#9ba1af);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:12px">NOVUS</div>
<h1 style="margin:0;font-family:'Chakra Petch',sans-serif;font-size:26px;font-weight:700">Admin access</h1>
<p style="margin:8px 0 0;font-size:13px;color:#7d8593">Sign in to manage NOVUS Fest 2026</p>
</div>
<form method="post" action="{% url 'novus:admin_login' %}" style="display:grid;gap:16px">
{% csrf_token %}
<label style="display:block"><span style="display:block;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;color:#6b7280;margin-bottom:8px">USERNAME</span><input name="username" style="width:100%;padding:14px 16px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.10);color:#e9ecf2;font-family:'Space Grotesk',sans-serif;font-size:15px;outline:none"></label>
<label style="display:block"><span style="display:block;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;color:#6b7280;margin-bottom:8px">PASSWORD</span><input type="password" name="password" style="width:100%;padding:14px 16px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.10);color:#e9ecf2;font-family:'Space Grotesk',sans-serif;font-size:15px;outline:none"></label>
<button type="submit" class="nv-plain-btn" style="text-align:center;padding:16px;border-radius:99px;background:#8eff01;color:#07080c;font-family:'Chakra Petch',sans-serif;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;box-shadow:0 0 34px rgba(142,255,1,.26)">Sign in</button>
</form>
</div>
</div>
</div>
{% endblock %}
